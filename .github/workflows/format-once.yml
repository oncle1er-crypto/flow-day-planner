name: One-time code formatting

on:
  push:
    branches:
      - "chatgpt/finish-flow-day-planner"

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip-format]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/finish-flow-day-planner

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Format repository
        run: npx prettier --write .

      - name: Apply safe ESLint fixes
        run: npx eslint . --fix || true

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: auto-format codebase [skip-format]"
          git push origin HEAD:chatgpt/finish-flow-day-planner
