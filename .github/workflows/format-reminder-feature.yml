name: Format reminder feature

on:
  push:
    branches:
      - chatgpt/reliable-reminders

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[prettier-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/reliable-reminders
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format owned reminder files
        run: npx prettier --write src/lib/native-reminders.ts src/routes/_authenticated/settings.tsx src/hooks/use-native-reminders.ts src/hooks/use-push-notifications.ts src/lib/reminder-plan.ts tests/reminder-plan.test.ts tests/e2e/public-smoke.spec.ts capacitor.config.ts .github/workflows/ci.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/native-reminders.ts src/routes/_authenticated/settings.tsx src/hooks/use-native-reminders.ts src/hooks/use-push-notifications.ts src/lib/reminder-plan.ts tests/reminder-plan.test.ts tests/e2e/public-smoke.spec.ts capacitor.config.ts .github/workflows/ci.yml
          if git diff --cached --quiet; then
            echo "Already formatted"
          else
            git commit -m "style: format reliable reminders [prettier-bot]"
            git push origin HEAD:chatgpt/reliable-reminders
          fi
