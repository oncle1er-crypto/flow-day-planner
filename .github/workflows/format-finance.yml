name: Format Finance Files

on:
  push:
    branches:
      - chatgpt/finance-debts-receivables

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/finance-debts-receivables
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format finance files
        run: npx prettier --write src/hooks/use-finance.ts src/lib/finance.ts src/lib/finance-security.ts src/routes/_authenticated/finance.tsx src/routes/_authenticated/finance-security.tsx src/routes/_authenticated/profile.tsx tests/finance.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/use-finance.ts src/lib/finance.ts src/lib/finance-security.ts src/routes/_authenticated/finance.tsx src/routes/_authenticated/finance-security.tsx src/routes/_authenticated/profile.tsx tests/finance.test.ts
          git commit -m "style: format finance module"
          git push origin HEAD:chatgpt/finance-debts-receivables
