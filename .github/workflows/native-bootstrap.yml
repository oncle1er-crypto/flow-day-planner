name: Bootstrap Capacitor native projects

on:
  push:
    branches:
      - chatgpt/reliable-reminders

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, '[native-bootstrap]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/reliable-reminders
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Capacitor 8 and Local Notifications
        run: |
          npm install @capacitor/core@^8 @capacitor/local-notifications@^8 @capacitor/android@^8 @capacitor/ios@^8
          npm install --save-dev @capacitor/cli@^8

      - name: Generate native Android and iOS shells
        run: |
          mkdir -p dist
          printf '<!doctype html><title>Flow Day Planner</title>' > dist/index.html
          if [ ! -d android ]; then npx cap add android; fi
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync

      - name: Enable exact Android reminders and boot restore
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text()
          marker = '<application'
          permissions = [
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />',
              '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />',
          ]
          missing = [x for x in permissions if x not in text]
          if missing:
              text = text.replace(marker, '\n'.join(missing) + '\n\n    ' + marker, 1)
              p.write_text(text)
          PY

      - name: Commit generated native projects and lockfile
        run: |
          rm -rf dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json android ios capacitor.config.ts
          if git diff --cached --quiet; then
            echo "Native projects already up to date"
          else
            git commit -m "chore: bootstrap Capacitor native projects [native-bootstrap]"
            git push origin HEAD:chatgpt/reliable-reminders
          fi
