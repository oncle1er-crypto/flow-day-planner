name: Flow Day Planner CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "chatgpt/**"

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Le package-lock.json historique de Lovable est actuellement désynchronisé
      # du package.json. On valide d'abord le code avec la résolution déclarée
      # dans package.json, sans réécrire le lockfile dans la CI.
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
