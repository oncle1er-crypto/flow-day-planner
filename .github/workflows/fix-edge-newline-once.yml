name: One-time edge newline fix

on:
  push:
    branches:
      - "chatgpt/finish-flow-day-planner"

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip-edge-newline]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/finish-flow-day-planner
      - name: Ensure trailing newline
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/push-reminders/index.ts')
          s = p.read_text()
          p.write_text(s.rstrip('\n') + '\n')
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/push-reminders/index.ts
          git commit -m "style: add edge function trailing newline [skip-edge-newline]"
          git push origin HEAD:chatgpt/finish-flow-day-planner
