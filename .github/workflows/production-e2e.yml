name: Production E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-e2e
  cancel-in-progress: true

jobs:
  production-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: https://plannificateur.vercel.app
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Require connected E2E credentials
        shell: bash
        run: |
          if [[ -z "$E2E_EMAIL" || -z "$E2E_PASSWORD" ]]; then
            echo "::error::GitHub secrets E2E_EMAIL and E2E_PASSWORD are required."
            exit 1
          fi

      - name: Wait for Vercel production
        shell: bash
        run: |
          for attempt in {1..36}; do
            if curl --fail --silent --show-error --max-time 10 "$E2E_BASE_URL/auth" >/dev/null; then
              echo "Production is reachable."
              exit 0
            fi
            echo "Waiting for production deployment ($attempt/36)..."
            sleep 10
          done
          echo "::error::Production did not become reachable in time."
          exit 1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run connected production suite
        run: npx playwright test tests/e2e/connected.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-playwright-report
          path: playwright-report/
          retention-days: 14
