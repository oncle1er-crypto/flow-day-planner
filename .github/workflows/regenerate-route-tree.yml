name: Regenerate Route Tree

on:
  push:
    branches:
      - chatgpt/finance-debts-receivables

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/finance-debts-receivables
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate route tree
        run: npm run build >/dev/null
      - name: Commit generated route tree
        run: |
          if git diff --quiet -- src/routeTree.gen.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts
          git commit -m "chore: regenerate finance route tree"
          git push origin HEAD:chatgpt/finance-debts-receivables
