name: One-time recurrence formatting

on:
  push:
    branches:
      - "chatgpt/finish-flow-day-planner"

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip-recurrence-format]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/finish-flow-day-planner

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format recurrence source
        run: npx prettier --write src/lib/recurrence.ts

      - name: Commit formatting
        run: |
          if git diff --quiet src/lib/recurrence.ts; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/recurrence.ts
          git commit -m "style: format recurrence source [skip-recurrence-format]"
          git push origin HEAD:chatgpt/finish-flow-day-planner
